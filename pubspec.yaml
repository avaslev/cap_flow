name: capflow
description: Budget app
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.7

environment:
  sdk: ^3.7.0-0

dependencies:
  adaptive_navigation: ^0.0.3
  crypto: ^3.0.8
  cupertino_icons: ^1.0.2
  file_picker: ^13.1.0
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^15.0.0
  intl: ^0.18.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  sqflite_common_ffi_web: ^1.0.1+1
  sqlite3_flutter_libs: ^0.5.1
  url_launcher: ^6.1.1
  uuid: ^4.5.1
  window_size:
    git:
      url: https://github.com/google/flutter-desktop-embedding.git
      path: plugins/window_size

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "launcher_icon"
  adaptive_icon_background: "assets/icon/bg.png"
  adaptive_icon_foreground: "assets/icon/fg.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true

flutter:
  uses-material-design: true
