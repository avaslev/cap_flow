name: ci

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true

      - run: flutter pub get

      # Baseline warning/info есть и локально — не валим сборку,
      # ошибки компиляции при этом всё равно упадут.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test
